name: preopt-calib
version: "104"
base_params: params/default.yaml
suite: suites/final-1.json
timelimit: 300

steps:
  - name: alpha-beta-calibration
    mode: combinations
    parameters:
      - preoptimize.alpha: 0.1
        preoptimize.beta: 0.1
        preoptimize.bay_padding: 0.5
        preoptimize.congestion_weight: 0.001

      - preoptimize.alpha: 0.3
        preoptimize.beta: 0.1
        preoptimize.bay_padding: 0.5
        preoptimize.congestion_weight: 0.001

      - preoptimize.alpha: 0.5
        preoptimize.beta: 0.3
        preoptimize.bay_padding: 0.5
        preoptimize.congestion_weight: 0.001

      - preoptimize.alpha: 0.7
        preoptimize.beta: 0.2
        preoptimize.bay_padding: 0.5
        preoptimize.congestion_weight: 0.001

      - preoptimize.alpha: 0.5
        preoptimize.beta: 0.1
        preoptimize.bay_padding: 0.5
        preoptimize.congestion_weight: 0.01
