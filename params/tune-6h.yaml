name: hard-6h
version: "056"
base_params: params/default.yaml
suite: suites/hard.json
timelimit: 60
jobs: 1

steps:
  - name: bay-padding
    mode: product
    parameters:
      preoptimize.bay_padding: [0.0, 1.0, 2.0, 3.0]

  - name: occupied-area
    mode: combinations
    parameters:
      - preoptimize.alpha: 0.8
        preoptimize.beta: 0.1
      - preoptimize.alpha: 0.4
        preoptimize.beta: 0.1
      - preoptimize.alpha: 1.2
        preoptimize.beta: 0.1
      - preoptimize.alpha: 0.8
        preoptimize.beta: 0.0
      - preoptimize.alpha: 0.8
        preoptimize.beta: 0.25

  - name: initial-phase-time
    mode: combinations
    parameters:
      - phases.initial_preoptimize.time_ratio: 0.05
        phases.initial_build.time_ratio: 0.05
      - phases.initial_preoptimize.time_ratio: 0.1
        phases.initial_build.time_ratio: 0.05
      - phases.initial_preoptimize.time_ratio: 0.15
        phases.initial_build.time_ratio: 0.075

  - name: precedence
    mode: combinations
    parameters:
      - preoptimize.precedence_margin: 0
        phases.global_constrained.time_ratio: 0.25
      - preoptimize.precedence_margin: 2
        phases.global_constrained.time_ratio: 0.1
      - preoptimize.precedence_margin: 2
        phases.global_constrained.time_ratio: 0.25
      - preoptimize.precedence_margin: 5
        phases.global_constrained.time_ratio: 0.25

  - name: global-temperature
    mode: combinations
    parameters:
      - global_optimize.annealing.start_temperature: 300.0
        global_optimize.annealing.end_temperature: 0.3
        global_optimize.annealing.worker_temperature_scale: 10.0
      - global_optimize.annealing.start_temperature: 1000.0
        global_optimize.annealing.end_temperature: 1.0
        global_optimize.annealing.worker_temperature_scale: 3.0
      - global_optimize.annealing.start_temperature: 1000.0
        global_optimize.annealing.end_temperature: 1.0
        global_optimize.annealing.worker_temperature_scale: 10.0
      - global_optimize.annealing.start_temperature: 3000.0
        global_optimize.annealing.end_temperature: 3.0
        global_optimize.annealing.worker_temperature_scale: 3.0

  - name: global-neighbor-mix
    mode: combinations
    parameters:
      - global_neighbor.probabilities.large_reconstruct: 0.2
        global_neighbor.probabilities.shift: 3.0
        global_neighbor.probabilities.move: 0.1
        global_neighbor.probabilities.rotate: 0.5
        global_neighbor.probabilities.swap: 3.0
      - global_neighbor.probabilities.large_reconstruct: 0.5
        global_neighbor.probabilities.shift: 2.0
        global_neighbor.probabilities.move: 0.3
        global_neighbor.probabilities.rotate: 1.0
        global_neighbor.probabilities.swap: 2.0
      - global_neighbor.probabilities.large_reconstruct: 0.8
        global_neighbor.probabilities.shift: 1.5
        global_neighbor.probabilities.move: 0.8
        global_neighbor.probabilities.rotate: 1.0
        global_neighbor.probabilities.swap: 1.5
