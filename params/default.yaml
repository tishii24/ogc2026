runtime:
  worker_count: 4
  solver_seed: 1
  preoptimize_seed: 2
  solve_time_buffer_seconds: 2.0
  solution_emit_min_interval_seconds: 10.0
  solution_emit_max_count: 10

phases:
  initial_preoptimize:
    time_ratio: 0.1
    max_seconds: 10.0
  optimize:
    base_horizon_size: 20
    time_allocation_power: 2.0
    expand_time_ratio: 0.05
    max_expand_seconds: 5.0

precompute:
  orientation_neighbor_limit: 100
  swap_neighbor_area_top_k: 16
  swap_neighbor_align_delta: 3

insert:
  y_buffer: 10
  anchor_randomness: 0.2

annealing:
  preoptimize:
    exchange_interval: 1000000
    positive_tardiness:
      temperature_initial_score_per_block_scale: [1.0, 0.01]
      exchange_threshold:
        w1_scale: 0.5
        w3_scale: 50.0
    zero_tardiness:
      temperature_w3_scale: [10.0, 1.0]
      exchange_threshold:
        w1_scale: 0.5
        w3_scale: 50.0
    tabu_capacity: 4096
  optimize:
    exchange_interval: 2000
    reheat:
      best_return_interval: 100000
      interval: 50000
      temperature_scale: 2.0
    positive_tardiness:
      temperature_initial_score_per_block_scale: [0.2, 0.02]
      exchange_threshold:
        w1_scale: 0.5
        w3_scale: 50.0
    zero_tardiness:
      temperature_w3_scale: [5.0, 0.5]
      exchange_threshold:
        w1_scale: 0.5
        w3_scale: 50.0
    tabu_capacity: 4096

preoptimize:
  alpha: 0.8
  beta: 0.1
  bay_padding: 0.0
  congestion_weight: 0.001
  initial_build:
    time_ratio: 0.1
    max_seconds: 1.0
  neighbor_probabilities:
    relocate: 0.8
    swap: 0.15
    large_reconstruct: 0.05
  neighbor:
    min_removed_blocks: 7
    max_removed_blocks: 13
    remove_count_sample_power: 2.0
    bad_block_sample_count: 8
    bad_block_select_probability: 0.75
    max_relocate_attempts: 8
    max_time_shift: 10

neighbor:
  probabilities:
    large_reconstruct: 0.2
    shift: 3.0
    move: 0.1
    rotate: 0.5
    swap: 3.0
  reconstruct:
    min_removed_blocks: 7
    max_removed_blocks: 13
    remove_pool_factor: 4
    remove_count_sample_power: 2.0
    remove_seed_per_block: [1, 4]
    remove_entry_base_interval_weights: [0.0, 0.0, 1.0, 1.0, 1.0]
    remove_entry_seed_candidate_count: 10
    remove_seed_method_weights:
      badness: 1.0
      fluidity: 1.0
      random: 2.0
    remove_fluidity_slack_weight_range: [0.5, 2.0]
    remove_fluidity_pref_spread_weight_range: [0.5, 2.0]
    remove_x_distance_weight_range: [0.1, 4.0]
    remove_y_distance_weight_range: [0.1, 4.0]
    remove_t_distance_weight_range: [0.5, 1.5]
    workload_weight_range: [0.0, 0.3]
    volume_weight_range: [0.5, 2.0]
    pref_spread_weight_range: [0.0, 0.3]
    limit_time_urgency_weight_range: [0.5, 2.0]
    slack_tightness_weight_range: [0.0, 0.3]
    current_penalty_weight_range: [0.0, 2.0]
    order_random_weight_range: [0.0, 0.3]
    insert_candidate_top_k: 4
    insert_candidate_select_p: 0.7
  shift:
    dy_range: [-5, 0]
  move:
    sample_blocks: 16
    small_pool_size: 8
  rotate:
    dy_range: [-2, 2]
  swap:
    neighbor_top_k: 32
    dy_range: [-2, 2]
