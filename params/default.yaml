runtime:
  worker_count: 4
  solver_seed: 1
  preoptimize_seed: 2
  solve_time_buffer_seconds: 2.0
  solution_emit_min_interval_seconds: 10.0
  solution_emit_max_count: 10

phases:
  initial_preoptimize:
    time_ratio: 0.1
    max_seconds: 10.0
  optimize:
    base_horizon_size: 20
    time_allocation_power: 2.0
    expand_time_ratio: 0.05
    max_expand_seconds: 5.0

insert:
  y_buffer: 10
  anchor_randomness: 0.2
  worker_primary_anchors:
    - bottom_left
    - bottom_right
    - top_left
    - top_right

annealing:
  preoptimize:
    exchange_interval: 1000000
    temperature_initial_score_per_block_scale: [1.0, 0.01]
    exchange_threshold:
      w1_scale: 10.0
      w3_scale: 500.0
  optimize:
    exchange_interval: 2000
    temperature_initial_score_per_block_scale: [0.2, 0.02]
    exchange_threshold:
      w1_scale: 10.0
      w3_scale: 500.0

preoptimize:
  alpha: 0.5
  beta: 0.1
  bay_padding: 0.5
  congestion_weight: 0.001
  initial_build:
    time_ratio: 0.1
    max_seconds: 1.0
  neighbor_probabilities:
    relocate: 0.8
    swap: 0.15
    large_reconstruct: 0.05
  neighbor:
    remove_count:
      type: lower
      range: [7, 13]
      shape: 2.0
    bad_block_sample_count: 8
    bad_block_select_probability: 0.75
    max_relocate_attempts: 8
    max_time_shift: 10

neighbor:
  probabilities:
    large_reconstruct: 0.2
    shift: 1.0
    move: 0.2
    rotate: 0.2
  reconstruct:
    remove_count:
      type: lower
      range: [7, 13]
      shape: 2.0
    remove_blocks_per_seed:
      type: lower
      range: [1, 4]
      shape: 1.0
    remove_pool_factor: 1
    remove_entry_base_interval_weights: [0.0, 0.0, 1.0, 1.0, 1.0]
    remove_entry_seed_candidate_count: 5
    remove_seed_method_weights:
      badness: 1.0
      fluidity: 1.0
      random: 2.0
    remove_fluidity_slack_weight_range: [0.5, 2.0]
    remove_fluidity_pref_spread_weight_range: [0.5, 2.0]
    remove_x_distance_weight_range: [0.1, 4.0]
    remove_y_distance_weight_range: [0.001, 0.002]
    remove_t_distance_weight_range: [0.5, 1.5]
    remove_distance_power_range: [2.0, 4.0]
    volume_weight_range: [0.5, 2.0]
    pref_spread_weight_range: [0.0, 0.3]
    limit_time_urgency_weight_range: [0.5, 2.0]
    current_penalty_weight_range: [0.0, 2.0]
    order_random_weight_range: [0.0, 0.3]
    slack_tightness_weight_range: [0.0, 0.3]
    insert_candidate_top_k: 4
    insert_candidate_select_p: 0.7
  shift:
    dy_range: [-5, 0]
  rotate:
    dy_range: [-2, 2]
