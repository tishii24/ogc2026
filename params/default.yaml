runtime:
  worker_count: 4
  solver_seed: 1
  preoptimize_seed: 2
  local_search_time_buffer_seconds: 3.0

phases:
  initial_preoptimize:
    time_ratio: 0.1
    max_seconds: 10.0
  initial_build:
    time_ratio: 0.1
    max_seconds: 10.0
  global_constrained:
    time_ratio: 0.25
    max_seconds: 20.0

precompute:
  orientation_neighbor_limit: 100
  other_block_neighbor_area_top_k: 16
  other_block_neighbor_align_delta: 3

insert:
  y_sample_ratio_base: 1.0
  y_sample_ratio_min: 1.0
  y_buffer: 10

preoptimize:
  alpha: 0.8
  beta: 0.1
  bay_padding: 0.0
  precedence_margin: 2
  congestion_weight: 0.001
  exchange_threshold_w1_scale: 0.0
  neighbor_probabilities:
    relocate: 0.8
    swap: 0.15
    large_reconstruct: 0.05
  neighbor:
    min_removed_blocks: 7
    max_removed_blocks: 13
    remove_count_sample_power: 2.0
    bad_block_sample_count: 8
    bad_block_select_probability: 0.75
    max_relocate_attempts: 8
    max_time_shift: 10
  annealing:
    exchange_interval: 1000000
    initial_score_per_block_scale: 1.0
    end_temperature_ratio: 0.0001
    worker_temperature_scale: 0.0
    tabu_capacity: 4096

global_optimize:
  exchange_threshold_w1_scale: 0.0
  annealing:
    exchange_interval: 2048
    start_temperature: 1000.0
    end_temperature: 1.0
    worker_temperature_scale: 10.0
    tabu_capacity: 4096

optimize_neighbor:
  default:
    probabilities:
      large_reconstruct: 0.2
      shift: 3.0
      move: 0.1
      rotate: 0.5
      swap: 3.0
    min_removed_blocks: 7
    max_removed_blocks: 13
    remove_pool_factor: 4
    remove_count_sample_power: 2.0
    remove_seed_per_block: 4
    remove_random_seed_ratio: 0.25
    remove_method_weights:
      local_proximity: 0.0
      entry_time_window: 1.0
    remove_entry_time_window_ratio_range: [0.05, 0.2]
    remove_entry_time_seed_count_range: [2, 4]
    remove_entry_time_neighbors_per_seed_range: [1, 3]
    remove_x_distance_weight_max: 3.0
    remove_y_distance_weight_max: 3.0
    reconstruct_workload_weight_range: [0.0, 1.0]
    reconstruct_volume_weight_range: [-0.2, 1.0]
    reconstruct_pref_spread_weight_range: [0.0, 1.0]
    reconstruct_limit_time_urgency_weight_range: [0.0, 1.0]
    reconstruct_order_random_weight_range: [0.0, 0.5]
    shift_max_x: 5
    shift_max_y: 5
    rotate_max_shift_delta: 2
    swap_neighbor_top_k: 32
    swap_max_shift_delta: 2
    move_sample_blocks: 16
    move_small_pool_size: 8
  global: {}
