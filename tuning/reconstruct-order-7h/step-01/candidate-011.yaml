runtime:
  worker_count: 4
  solver_seed: 1
  preoptimize_seed: 2
  local_search_time_buffer_seconds: 3.0
phases:
  initial_preoptimize:
    time_ratio: 0.1
    max_seconds: 10.0
  initial_build:
    time_ratio: 0.1
    max_seconds: 10.0
  global_constrained:
    time_ratio: 0.25
    max_seconds: 20.0
precompute:
  orientation_neighbor_limit: 100
  other_block_neighbor_area_top_k: 16
  other_block_neighbor_align_delta: 3
insert:
  y_buffer: 10
  reconstruct_random_progress_power: 1.0
  reconstruct_bay_skip_probability: 0.0
  reconstruct_orientation_skip_probability: 0.0
  reconstruct_y_skip_probability: 0.0
  reconstruct_bbox_anchor_probability: 0.0
annealing:
  preoptimize:
    exchange_interval: 1000000
    positive_tardiness:
      type: geometric
      temperature_initial_score_per_block_scale:
      - 1.0
      - 0.01
      exchange_threshold:
        w1_scale: 0.5
        w3_scale: 50.0
    zero_tardiness:
      type: geometric
      temperature_w3_scale:
      - 10.0
      - 1.0
      exchange_threshold:
        w1_scale: 0.5
        w3_scale: 50.0
    worker_temperature_scale: 0.0
    tabu_capacity: 4096
  optimize:
    exchange_interval: 2000
    positive_tardiness:
      type: geometric
      temperature_initial_score_per_block_scale:
      - 1.0
      - 0.01
      reheat_local_best_score_per_block_scale: 1.0
      exchange_threshold:
        w1_scale: 0.5
        w3_scale: 50.0
    zero_tardiness:
      type: geometric
      temperature_w3_scale:
      - 10.0
      - 1.0
      reheat_local_best_score_per_block_scale: 10.0
      exchange_threshold:
        w1_scale: 0.5
        w3_scale: 50.0
    worker_temperature_scale: 0.0
    tabu_capacity: 4096
preoptimize:
  alpha: 0.8
  beta: 0.1
  bay_padding: 0.0
  precedence_margin: 2
  congestion_weight: 0.001
  initial_build:
    time_ratio: 0.1
    max_seconds: 1.0
  neighbor_probabilities:
    relocate: 0.8
    swap: 0.15
    large_reconstruct: 0.05
  neighbor:
    min_removed_blocks: 7
    max_removed_blocks: 13
    remove_count_sample_power: 2.0
    remove_seed_per_block: 4
    bad_block_sample_count: 8
    bad_block_select_probability: 0.75
    max_relocate_attempts: 8
    max_time_shift: 10
optimize_neighbor:
  default:
    probabilities:
      large_reconstruct: 0.2
      shift: 3.0
      move: 0.1
      rotate: 0.5
      swap: 3.0
    min_removed_blocks: 7
    max_removed_blocks: 13
    remove_pool_factor: 4
    remove_count_sample_power: 2.0
    remove_seed_per_block:
    - 1
    - 3
    remove_entry_base_interval_weights:
    - 0.0
    - 0.0
    - 1.0
    remove_entry_seed_candidate_count: 10
    remove_seed_strategy_weights:
      local_proximity: 1.0
    remove_seed_method_weights:
      badness: 1.0
      fluidity: 1.0
      random: 2.0
    remove_fluidity_slack_weight_range:
    - 0.5
    - 2.0
    remove_fluidity_pref_spread_weight_range:
    - 0.5
    - 2.0
    remove_x_distance_weight_max: 3.0
    remove_y_distance_weight_max: 3.0
    reconstruct_workload_weight_range:
    - 0.0
    - 1.0
    reconstruct_volume_weight_range:
    - -0.2
    - 1.0
    reconstruct_pref_spread_weight_range:
    - 0.0
    - 1.0
    reconstruct_limit_time_urgency_weight_range:
    - 0.0
    - 1.0
    reconstruct_order_random_weight_range:
    - 0.0
    - 0.0
    shift_dy_range:
    - -5
    - 0
    rotate_dy_range:
    - -2
    - 2
    swap_neighbor_top_k: 32
    swap_dy_range:
    - -2
    - 2
    move_sample_blocks: 16
    move_small_pool_size: 8
  global: {}
