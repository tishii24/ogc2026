<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
  <title id="title">Overall algorithm framework</title>
  <desc id="desc">A five-stage optimization pipeline from preprocessing to validated output, with a feedback loop from global improvement to geometric reconstruction.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#6f716d" stroke-width="1.4"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#a36c4f" stroke-width="1.4"/>
    </marker>
    <style>
      .title { font-family: Georgia, serif; font-size: 31px; font-weight: 700; fill: #30312e; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; fill: #777a73; }
      .stage { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #30312e; }
      .body { font-family: Arial, sans-serif; font-size: 15px; fill: #50534e; }
      .small { font-family: Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1px; fill: #777a73; }
      .note { font-family: Arial, sans-serif; font-size: 14px; fill: #5f625b; }
      .flow { fill: none; stroke: #7b7d77; stroke-width: 2; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #a36c4f; stroke-width: 2; marker-end: url(#arrow-accent); }
    </style>
  </defs>

  <rect width="1440" height="800" fill="#fbfaf7"/>
  <path d="M 70 125 H 1370" stroke="#dedbd3" stroke-width="1"/>

  <text x="70" y="78" class="title">Overall Algorithm Framework</text>
  <text x="70" y="105" class="subtitle">Relaxed scheduling first, exact geometry later</text>

  <g transform="translate(70 175)">
    <rect width="238" height="325" rx="14" fill="#fffefa" stroke="#d8d5cc" stroke-width="1.5"/>
    <rect width="7" height="325" rx="3.5" fill="#7aa6a1"/>
    <text x="28" y="37" class="small">01 / PREPARE</text>
    <text x="28" y="76" class="stage">Preprocessing</text>
    <text x="28" y="121" class="body">Bounding boxes</text>
    <text x="28" y="151" class="body">Fit ranges in each bay</text>
    <text x="28" y="181" class="body">Orientation neighbors</text>
    <text x="28" y="211" class="body">Lazy collision grids</text>
    <path d="M 28 250 H 210" stroke="#e4e1d8"/>
    <text x="28" y="279" class="note">Reusable geometric data</text>
  </g>

  <g transform="translate(365 175)">
    <rect width="238" height="325" rx="14" fill="#fffefa" stroke="#d8d5cc" stroke-width="1.5"/>
    <rect width="7" height="325" rx="3.5" fill="#8fa77c"/>
    <text x="28" y="37" class="small">02 / ABSTRACT</text>
    <text x="28" y="76" class="stage">Abstract schedule</text>
    <text x="28" y="121" class="body">Area-capacity model</text>
    <text x="28" y="151" class="body">Bay and entry time</text>
    <text x="28" y="181" class="body">Randomized greedy builds</text>
    <text x="28" y="211" class="body">Relocate / swap / LNS</text>
    <path d="M 28 250 H 210" stroke="#e4e1d8"/>
    <text x="28" y="279" class="note">Good temporal structure</text>
  </g>

  <g transform="translate(660 175)">
    <rect width="238" height="325" rx="14" fill="#fffefa" stroke="#d8d5cc" stroke-width="1.5"/>
    <rect width="7" height="325" rx="3.5" fill="#c38a62"/>
    <text x="28" y="37" class="small">03 / REBUILD</text>
    <text x="28" y="76" class="stage">Reconstruction</text>
    <text x="28" y="121" class="body">Heuristic precedence</text>
    <text x="28" y="151" class="body">Topological order</text>
    <text x="28" y="181" class="body">Greedy reinsertion</text>
    <text x="28" y="211" class="body">Crane-aware scanning</text>
    <path d="M 28 250 H 210" stroke="#e4e1d8"/>
    <text x="28" y="279" class="note">Feasible geometric state</text>
  </g>

  <g transform="translate(955 175)">
    <rect width="238" height="325" rx="14" fill="#fffefa" stroke="#d8d5cc" stroke-width="1.5"/>
    <rect width="7" height="325" rx="3.5" fill="#aa8d9b"/>
    <text x="28" y="37" class="small">04 / IMPROVE</text>
    <text x="28" y="76" class="stage">Global improvement</text>
    <text x="28" y="121" class="body">Constrained phase</text>
    <text x="28" y="151" class="body">Unconstrained phase</text>
    <text x="28" y="181" class="body">Shift / move / rotate</text>
    <text x="28" y="211" class="body">Swap / large reconstruct</text>
    <path d="M 28 250 H 210" stroke="#e4e1d8"/>
    <text x="28" y="279" class="note">Shared-best exploration</text>
  </g>

  <g transform="translate(1250 175)">
    <rect width="120" height="325" rx="14" fill="#fffefa" stroke="#d8d5cc" stroke-width="1.5"/>
    <rect width="7" height="325" rx="3.5" fill="#d1a45f"/>
    <text x="60" y="37" text-anchor="middle" class="small">05 / WRITE</text>
    <text x="60" y="76" text-anchor="middle" class="stage">Output</text>
    <text x="60" y="127" text-anchor="middle" class="body">Candidate</text>
    <text x="60" y="157" text-anchor="middle" class="body">Feasibility</text>
    <text x="60" y="187" text-anchor="middle" class="body">check</text>
    <path d="M 18 250 H 102" stroke="#e4e1d8"/>
    <text x="60" y="279" text-anchor="middle" class="note">Validated</text>
  </g>

  <line x1="315" y1="337" x2="355" y2="337" stroke="#7b7d77" stroke-width="2"/>
  <path d="M 355 337 L 345 331 L 345 343 Z" fill="#7b7d77"/>
  <line x1="610" y1="337" x2="650" y2="337" stroke="#7b7d77" stroke-width="2"/>
  <path d="M 650 337 L 640 331 L 640 343 Z" fill="#7b7d77"/>
  <line x1="905" y1="337" x2="945" y2="337" stroke="#7b7d77" stroke-width="2"/>
  <path d="M 945 337 L 935 331 L 935 343 Z" fill="#7b7d77"/>
  <line x1="1200" y1="337" x2="1240" y2="337" stroke="#7b7d77" stroke-width="2"/>
  <path d="M 1240 337 L 1230 331 L 1230 343 Z" fill="#7b7d77"/>

  <line x1="1074" y1="530" x2="1074" y2="588" stroke="#a36c4f" stroke-width="2"/>
  <line x1="1074" y1="588" x2="780" y2="588" stroke="#a36c4f" stroke-width="2"/>
  <line x1="780" y1="588" x2="780" y2="530" stroke="#a36c4f" stroke-width="2"/>
  <path d="M 780 520 L 772 535 L 788 535 Z" fill="#a36c4f"/>
  <text x="927" y="615" text-anchor="middle" class="note" fill="#a36c4f">Iterate from the shared best state</text>

  <g transform="translate(70 670)">
    <path d="M 0 0 H 1300" stroke="#dedbd3"/>
    <text x="0" y="35" class="note">The abstract stage supplies temporal guidance; reconstruction enforces exact geometric feasibility.</text>
  </g>
</svg>
