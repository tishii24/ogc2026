<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">Large reconstruction cycle</title>
  <desc id="desc">A three-step cycle that removes selected items, reorders them, and reinserts them into the geometric schedule.</desc>

  <defs>
    <marker id="cycle-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#6f716d" stroke-width="1.5"/>
    </marker>
    <style>
      .title { font-family: Georgia, serif; font-size: 31px; font-weight: 700; fill: #30312e; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; fill: #777a73; }
      .step { font-family: Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #30312e; }
      .body { font-family: Arial, sans-serif; font-size: 15px; fill: #50534e; }
      .small { font-family: Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1px; fill: #777a73; }
      .center { font-family: Georgia, serif; font-size: 19px; font-weight: 700; fill: #5a5b55; }
      .arrow { fill: none; stroke: #6f716d; stroke-width: 2.2; marker-end: url(#cycle-arrow); }
    </style>
  </defs>

  <rect width="1000" height="680" fill="#fbfaf7"/>
  <path d="M 70 125 H 930" stroke="#dedbd3" stroke-width="1"/>
  <text x="70" y="78" class="title">Large Reconstruction</text>
  <text x="70" y="105" class="subtitle">A simple neighborhood move for escaping a locally good arrangement</text>

  <circle cx="500" cy="350" r="104" fill="#f1eee6" stroke="#d8d5cc" stroke-width="1.5"/>
  <text x="500" y="341" text-anchor="middle" class="center">candidate</text>
  <text x="500" y="368" text-anchor="middle" class="center">state</text>
  <text x="500" y="402" text-anchor="middle" class="small">REBUILD A PART</text>

  <g transform="translate(160 185)">
    <rect width="250" height="118" rx="13" fill="#fffefa" stroke="#d8d5cc" stroke-width="1.5"/>
    <rect width="7" height="118" rx="3.5" fill="#c38a62"/>
    <text x="28" y="31" class="small">01</text>
    <text x="28" y="64" class="step">Remove</text>
    <text x="28" y="91" class="body">Take out a selected group</text>
  </g>

  <g transform="translate(590 185)">
    <rect width="250" height="118" rx="13" fill="#fffefa" stroke="#d8d5cc" stroke-width="1.5"/>
    <rect width="7" height="118" rx="3.5" fill="#7aa6a1"/>
    <text x="28" y="31" class="small">02</text>
    <text x="28" y="64" class="step">Reorder</text>
    <text x="28" y="91" class="body">Change their precedence</text>
  </g>

  <g transform="translate(375 475)">
    <rect width="250" height="118" rx="13" fill="#fffefa" stroke="#d8d5cc" stroke-width="1.5"/>
    <rect width="7" height="118" rx="3.5" fill="#d1a45f"/>
    <text x="28" y="31" class="small">03</text>
    <text x="28" y="64" class="step">Reinsert</text>
    <text x="28" y="91" class="body">Place them with exact checks</text>
  </g>

  <line x1="410" y1="244" x2="590" y2="244" stroke="#6f716d" stroke-width="2.2"/>
  <path d="M 590 244 L 578 237 L 578 251 Z" fill="#6f716d"/>
  <line x1="785" y1="303" x2="620" y2="500" stroke="#6f716d" stroke-width="2.2"/>
  <path d="M 620 500 L 637 495 L 631 510 Z" fill="#6f716d"/>
  <line x1="375" y1="500" x2="215" y2="303" stroke="#6f716d" stroke-width="2.2"/>
  <path d="M 215 303 L 206 319 L 222 317 Z" fill="#6f716d"/>

  <g transform="translate(70 635)">
    <path d="M 0 0 H 860" stroke="#dedbd3"/>
    <text x="0" y="27" class="body">The selected items are rebuilt while the rest of the schedule remains unchanged.</text>
  </g>
</svg>
